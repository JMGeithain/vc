name: Build German VC 4.05

on:
  push:
    branches: [german-4.05]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out German translation
        uses: actions/checkout@v4
        with:
          ref: german-4.05

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm qemu-system-i386 mtools coreutils

      - name: Prepare reproducible DOS build
        run: |
          git clone --depth 1 --branch build --recurse-submodules https://github.com/ddanila/vc.git /tmp/vc-build
          cp versions/4.05/VCMENU.INC /tmp/vc-build/versions/4.05/VCMENU.INC
          python3 - <<'PY'
          from pathlib import Path

          source = Path('/tmp/vc-build/versions/4.05/VCSUB2.INC')
          data = source.read_bytes()
          old = b"PtMnu_S\tDB\t0FFh,4,'Left',0FFh,4,'Files',0FFh,4,'Commands'\r\n\tDB\t0FFh,4,'Options',0FFh,4,'Right',0FFh,31,0"
          new = b"PtMnu_S\tDB\t0FFh,4,'Links',0FFh,4,'Dateien',0FFh,4,'Befehle'\r\n\tDB\t0FFh,4,'Optionen',0FFh,4,'Rechts',0FFh,28,0"
          if data.count(old) != 1:
              raise SystemExit('Expected one 4.05 menu-bar source block')
          data = data.replace(old, new)

          old_keys = (
              b"Key_S\tDB\t'      '\t\t;  0\r\n"
              b"\tDB\t'Help  '\t\t;  1\r\n"
              b"\tDB\t'Menu  '\t\t;  2\r\n"
              b"\tDB\t'View  '\t\t;  3\r\n"
              b"\tDB\t'Edit  '\t\t;  4\r\n"
              b"\tDB\t'Copy  '\t\t;  5\r\n"
              b"\tDB\t'RenMov'\t\t;  6\r\n"
              b"\tDB\t'Mkdir '\t\t;  7\r\n"
              b"\tDB\t'Delete'\t\t;  8\r\n"
              b"\tDB\t'PullDn'\t\t;  9\r\n"
              b"\tDB\t'Quit  '\t\t; 10\r\n"
              b"\tDB\t'SavSet'\t\t; 11\r\n"
              b"\tDB\t'PullDn'\t\t; 12\r\n"
              b"\tDB\t'Left  '\t\t; 13\r\n"
              b"\tDB\t'Right '\t\t; 14\r\n"
              b"\tDB\t'View..'\t\t; 15\r\n"
              b"\tDB\t'Edit..'\t\t; 16\r\n"
              b"\tDB\t'DirSiz'\t\t; 17\r\n"
              b"\tDB\t'Find  '\t\t; 18\r\n"
              b"\tDB\t'Histry'\t\t; 19\r\n"
              b"\tDB\t'EGA Ln'\t\t; 20\r\n"
              b"\tDB\t'Tree  '\t\t; 21\r\n"
              b"\tDB\t'ASCII '\t\t; 22\r\n"
              b"\tDB\t'Hex   '\t\t; 23\r\n"
              b"\tDB\t'Wrap  '\t\t; 24\r\n"
              b"\tDB\t'Unwrap'\t\t; 25\r\n"
              b"\tDB\t'Search'\t\t; 26\r\n"
              b"\tDB\t'Save  '\t\t; 27\r\n"
              b"\tDB\t'Save..'\t\t; 28\r\n"
              b"\tDB\t'Q&Save'\t\t; 29\r\n"
              b"\tDB\t'Memory'\t\t; 30\r\n"
              b"\tDB\t'Main  '\t\t; 31\r\n"
              b"\tDB\t'Label '\t\t; 32\r\n"
              b"\tDB\t'Rescan'\t\t; 33"
          )
          new_keys = (
              b"Key_S\tDB\t'      '\t\t;  0\r\n"
              b"\tDB\t'Hilfe '\t\t;  1\r\n"
              b"\tDB\t'Menue '\t\t;  2\r\n"
              b"\tDB\t'Ansich'\t\t;  3\r\n"
              b"\tDB\t'Bearb.'\t\t;  4\r\n"
              b"\tDB\t'Kopier'\t\t;  5\r\n"
              b"\tDB\t'Umben.'\t\t;  6\r\n"
              b"\tDB\t'Ordner'\t\t;  7\r\n"
              b"\tDB\t'Loesch'\t\t;  8\r\n"
              b"\tDB\t'Menue>'\t\t;  9\r\n"
              b"\tDB\t'Ende  '\t\t; 10\r\n"
              b"\tDB\t'Sich. '\t\t; 11\r\n"
              b"\tDB\t'Menue>'\t\t; 12\r\n"
              b"\tDB\t'Links '\t\t; 13\r\n"
              b"\tDB\t'Rechts'\t\t; 14\r\n"
              b"\tDB\t'Ans...'\t\t; 15\r\n"
              b"\tDB\t'Bearb.'\t\t; 16\r\n"
              b"\tDB\t'Groess'\t\t; 17\r\n"
              b"\tDB\t'Suche '\t\t; 18\r\n"
              b"\tDB\t'Hist. '\t\t; 19\r\n"
              b"\tDB\t'EGA Z.'\t\t; 20\r\n"
              b"\tDB\t'Baum  '\t\t; 21\r\n"
              b"\tDB\t'ASCII '\t\t; 22\r\n"
              b"\tDB\t'Hex   '\t\t; 23\r\n"
              b"\tDB\t'Umbr.E'\t\t; 24\r\n"
              b"\tDB\t'Umbr.A'\t\t; 25\r\n"
              b"\tDB\t'Suchen'\t\t; 26\r\n"
              b"\tDB\t'Sicher'\t\t; 27\r\n"
              b"\tDB\t'Sich..'\t\t; 28\r\n"
              b"\tDB\t'End+Sp'\t\t; 29\r\n"
              b"\tDB\t'Speich'\t\t; 30\r\n"
              b"\tDB\t'Haupt '\t\t; 31\r\n"
              b"\tDB\t'Name  '\t\t; 32\r\n"
              b"\tDB\t'NeuLes'\t\t; 33"
          )
          if data.count(old_keys) != 1:
              raise SystemExit('Expected one 4.05 function-key label table')
          source.write_bytes(data.replace(old_keys, new_keys))

          def replace_once(path, old, new):
              p = Path('/tmp/vc-build/versions/4.05') / path
              data = p.read_bytes()
              if data.count(old) != 1:
                  raise SystemExit(f'Expected one source string in {path}: {old!r}')
              p.write_bytes(data.replace(old, new))

          # Translate setup and file-operation dialogs without changing their layout.
          replace_once('VCFUNC.INC', b"Quit1_S\tDB\t' The ^I ',0", b"Quit1_S\tDB\t' Der ^I ',0")
          replace_once('VCFUNC.INC', b"Quit2_S\tDB\t'Do you want to quit the ^I?',0", b"Quit2_S\tDB\t'Moechten Sie ^I beenden?',0")
          replace_once('VCFUNC.INC', b"YesNo_S\tDB\t'Yes',0FFh,3,'No',0", b"YesNo_S\tDB\t'Ja',0FFh,4,'Nein',0")
          replace_once('VCCOPY.INC', b"Copy0_S\tDB\t' Copy ',0", b"Copy0_S\tDB\t' Kopieren ',0")
          replace_once('VCCOPY.INC', b"Move0_S\tDB\t' Move ',0", b"Move0_S\tDB\t' Verschieben ',0")
          replace_once('VCCOPY.INC', b"Ren0_S\tDB\t' Rename ',0", b"Ren0_S\tDB\t' Umbenennen ',0")
          replace_once('VCCOPY.INC', b"Ren1_S\tDB\t'Rename \"^V\" to',0", b"Ren1_S\tDB\t'\"^V\" umbenennen in',0")
          replace_once('VCCOPY.INC', b"RnMv_S\tDB\t'Rename or move '", b"RnMv_S\tDB\t'Umbenennen/verschieben '")
          replace_once('VCCOPY.INC', b"CopTo_S\tDB\t'^V to',0", b"CopTo_S\tDB\t'^V nach',0")
          replace_once('VCCOPY.INC', b"CpTo1_S\tDB\t'to',0FFh,LenStr-2,0", b"CpTo1_S\tDB\t'nach',0FFh,LenStr-4,0")
          replace_once('VCCOPY.INC', b"CoMnu_S\tDB\t'[^I]',0FFh,3,'[ F10-Tree ]',0FFh,3,'[ Cancel ]',0", b"CoMnu_S\tDB\t'[^I]',0FFh,3,'[ F10-Baum ]',0FFh,3,'[ Abbruch ]',0")
          replace_once('VCCOPY.INC', b"CopFi_S\tDB\t'Copying the file',0", b"CopFi_S\tDB\t'Datei kopieren',0")
          replace_once('VCCOPY.INC', b"MovFi_S\tDB\t'Moving the file',0", b"MovFi_S\tDB\t'Datei verschieben',0")
          replace_once('VCCOPY.INC', b"RenFi_S\tDB\t'Renaming or moving the file',0", b"RenFi_S\tDB\t'Datei umben./verschieben',0")

          # Recover the original single-byte DOS character values from GitHub's UTF-8 text.
          translated = Path('versions/4.05/VCSETUP.ASM').read_text(encoding='utf-8')
          dos_source = translated.encode('latin-1', errors='strict')
          old, new = "Configuration".encode('ascii'), "Konfiguration".encode('ascii')
          if old not in dos_source:
              raise SystemExit('Missing expected setup label: ' + old.decode('ascii'))
          dos_source = dos_source.replace(old, new)
          old, new = "General options".encode('ascii'), "Allgemeines".encode('ascii')
          if old not in dos_source:
              raise SystemExit('Missing expected setup label: ' + old.decode('ascii'))
          dos_source = dos_source.replace(old, new)
          old, new = "Execute options".encode('ascii'), "Startoptionen".encode('ascii')
          if old not in dos_source:
              raise SystemExit('Missing expected setup label: ' + old.decode('ascii'))
          dos_source = dos_source.replace(old, new)
          old, new = "Auto menus".encode('ascii'), "Menue auto".encode('ascii')
          if old not in dos_source:
              raise SystemExit('Missing expected setup label: ' + old.decode('ascii'))
          dos_source = dos_source.replace(old, new)
          old, new = "Path prompt".encode('ascii'), "Pfadabfrage".encode('ascii')
          if old not in dos_source:
              raise SystemExit('Missing expected setup label: ' + old.decode('ascii'))
          dos_source = dos_source.replace(old, new)
          old, new = "Key bar".encode('ascii'), "Tastenleiste".encode('ascii')
          if old not in dos_source:
              raise SystemExit('Missing expected setup label: ' + old.decode('ascii'))
          dos_source = dos_source.replace(old, new)
          old, new = "Menu bar visible".encode('ascii'), "Menueleiste an".encode('ascii')
          if old not in dos_source:
              raise SystemExit('Missing expected setup label: ' + old.decode('ascii'))
          dos_source = dos_source.replace(old, new)
          old, new = "Full screen".encode('ascii'), "Vollbild".encode('ascii')
          if old not in dos_source:
              raise SystemExit('Missing expected setup label: ' + old.decode('ascii'))
          dos_source = dos_source.replace(old, new)
          old, new = "Clock".encode('ascii'), "Uhr".encode('ascii')
          if old not in dos_source:
              raise SystemExit('Missing expected setup label: ' + old.decode('ascii'))
          dos_source = dos_source.replace(old, new)
          old, new = "Confirmation on quit".encode('ascii'), "Beenden bestaetigen".encode('ascii')
          if old not in dos_source:
              raise SystemExit('Missing expected setup label: ' + old.decode('ascii'))
          dos_source = dos_source.replace(old, new)
          old, new = "Error sound".encode('ascii'), "Fehlerton".encode('ascii')
          if old not in dos_source:
              raise SystemExit('Missing expected setup label: ' + old.decode('ascii'))
          dos_source = dos_source.replace(old, new)
          old, new = "Auto save setup".encode('ascii'), "Setup sichern".encode('ascii')
          if old not in dos_source:
              raise SystemExit('Missing expected setup label: ' + old.decode('ascii'))
          dos_source = dos_source.replace(old, new)
          old, new = "Show logical drive B:".encode('ascii'), "Laufwerk B: zeigen".encode('ascii')
          if old not in dos_source:
              raise SystemExit('Missing expected setup label: ' + old.decode('ascii'))
          dos_source = dos_source.replace(old, new)
          old, new = "Memory allocation".encode('ascii'), "Speicherbelegung".encode('ascii')
          if old not in dos_source:
              raise SystemExit('Missing expected setup label: ' + old.decode('ascii'))
          dos_source = dos_source.replace(old, new)
          old, new = "Quick execute commands".encode('ascii'), "Schnellstartbefehle".encode('ascii')
          if old not in dos_source:
              raise SystemExit('Missing expected setup label: ' + old.decode('ascii'))
          dos_source = dos_source.replace(old, new)
          old, new = "TSR manager".encode('ascii'), "TSR-Verwalt.".encode('ascii')
          if old not in dos_source:
              raise SystemExit('Missing expected setup label: ' + old.decode('ascii'))
          dos_source = dos_source.replace(old, new)
          old, new = "Keyboard options".encode('ascii'), "Tastatur".encode('ascii')
          if old not in dos_source:
              raise SystemExit('Missing expected setup label: ' + old.decode('ascii'))
          dos_source = dos_source.replace(old, new)
          old, new = "Alt alone selects menu".encode('ascii'), "Alt waehlt Menue".encode('ascii')
          if old not in dos_source:
              raise SystemExit('Missing expected setup label: ' + old.decode('ascii'))
          dos_source = dos_source.replace(old, new)
          old, new = "Esc toggles screen on/off".encode('ascii'), "Esc schaltet Anzeige um".encode('ascii')
          if old not in dos_source:
              raise SystemExit('Missing expected setup label: ' + old.decode('ascii'))
          dos_source = dos_source.replace(old, new)
          old, new = "Alternative viewer".encode('ascii'), "Zusatzbetrachter".encode('ascii')
          if old not in dos_source:
              raise SystemExit('Missing expected setup label: ' + old.decode('ascii'))
          dos_source = dos_source.replace(old, new)
          old, new = "Alternative editor".encode('ascii'), "Zusatzeditor".encode('ascii')
          if old not in dos_source:
              raise SystemExit('Missing expected setup label: ' + old.decode('ascii'))
          dos_source = dos_source.replace(old, new)
          old, new = "Clear keyboard buffer".encode('ascii'), "Tastaturpuffer leeren".encode('ascii')
          if old not in dos_source:
              raise SystemExit('Missing expected setup label: ' + old.decode('ascii'))
          dos_source = dos_source.replace(old, new)
          old, new = "Screen and Mouse".encode('ascii'), "Bild & Maus".encode('ascii')
          if old not in dos_source:
              raise SystemExit('Missing expected setup label: ' + old.decode('ascii'))
          dos_source = dos_source.replace(old, new)
          old, new = "Screen colors".encode('ascii'), "Bildschirmfarbe".encode('ascii')
          if old not in dos_source:
              raise SystemExit('Missing expected setup label: ' + old.decode('ascii'))
          dos_source = dos_source.replace(old, new)
          old, new = "Screen output".encode('ascii'), "Bildausgabe".encode('ascii')
          if old not in dos_source:
              raise SystemExit('Missing expected setup label: ' + old.decode('ascii'))
          dos_source = dos_source.replace(old, new)
          old, new = "Black & White".encode('ascii'), "Schwarzweiss".encode('ascii')
          if old not in dos_source:
              raise SystemExit('Missing expected setup label: ' + old.decode('ascii'))
          dos_source = dos_source.replace(old, new)
          old, new = "Synchronized access".encode('ascii'), "Synchron".encode('ascii')
          if old not in dos_source:
              raise SystemExit('Missing expected setup label: ' + old.decode('ascii'))
          dos_source = dos_source.replace(old, new)
          old, new = "Asynchronized access".encode('ascii'), "Asynchron".encode('ascii')
          if old not in dos_source:
              raise SystemExit('Missing expected setup label: ' + old.decode('ascii'))
          dos_source = dos_source.replace(old, new)
          old, new = "Auto detect".encode('ascii'), "Automatisch".encode('ascii')
          if old not in dos_source:
              raise SystemExit('Missing expected setup label: ' + old.decode('ascii'))
          dos_source = dos_source.replace(old, new)
          old, new = "Screen blank delay".encode('ascii'), "Bildschirm aus nach".encode('ascii')
          if old not in dos_source:
              raise SystemExit('Missing expected setup label: ' + old.decode('ascii'))
          dos_source = dos_source.replace(old, new)
          old, new = "Other options".encode('ascii'), "Sonstiges".encode('ascii')
          if old not in dos_source:
              raise SystemExit('Missing expected setup label: ' + old.decode('ascii'))
          dos_source = dos_source.replace(old, new)
          old, new = "Zooming boxes".encode('ascii'), "Zoomfenster".encode('ascii')
          if old not in dos_source:
              raise SystemExit('Missing expected setup label: ' + old.decode('ascii'))
          dos_source = dos_source.replace(old, new)
          old, new = "Screen saver chars:".encode('ascii'), "Bildschirmschutz:".encode('ascii')
          if old not in dos_source:
              raise SystemExit('Missing expected setup label: ' + old.decode('ascii'))
          dos_source = dos_source.replace(old, new)
          old, new = "Mouse options".encode('ascii'), "Maus".encode('ascii')
          if old not in dos_source:
              raise SystemExit('Missing expected setup label: ' + old.decode('ascii'))
          dos_source = dos_source.replace(old, new)
          old, new = "Left-handed mouse".encode('ascii'), "Linke Maus".encode('ascii')
          if old not in dos_source:
              raise SystemExit('Missing expected setup label: ' + old.decode('ascii'))
          dos_source = dos_source.replace(old, new)
          old, new = " Panel options ".encode('ascii'), " Bereichsoptionen ".encode('ascii')
          if old not in dos_source:
              raise SystemExit('Missing expected setup label: ' + old.decode('ascii'))
          dos_source = dos_source.replace(old, new)
          old, new = "File panel options".encode('ascii'), "Dateifenster".encode('ascii')
          if old not in dos_source:
              raise SystemExit('Missing expected setup label: ' + old.decode('ascii'))
          dos_source = dos_source.replace(old, new)
          old, new = "Mini status line".encode('ascii'), "Kurzstatus".encode('ascii')
          if old not in dos_source:
              raise SystemExit('Missing expected setup label: ' + old.decode('ascii'))
          dos_source = dos_source.replace(old, new)
          old, new = "Auto directory size".encode('ascii'), "Ordnergroesse auto".encode('ascii')
          if old not in dos_source:
              raise SystemExit('Missing expected setup label: ' + old.decode('ascii'))
          dos_source = dos_source.replace(old, new)
          old, new = "Ins moves down".encode('ascii'), "Einf. abwaerts".encode('ascii')
          if old not in dos_source:
              raise SystemExit('Missing expected setup label: ' + old.decode('ascii'))
          dos_source = dos_source.replace(old, new)
          old, new = "Unselect during group operation".encode('ascii'), "Gruppe: Markierung loeschen".encode('ascii')
          if old not in dos_source:
              raise SystemExit('Missing expected setup label: ' + old.decode('ascii'))
          dos_source = dos_source.replace(old, new)
          old, new = "Tree panel options".encode('ascii'), "Baumfenster".encode('ascii')
          if old not in dos_source:
              raise SystemExit('Missing expected setup label: ' + old.decode('ascii'))
          dos_source = dos_source.replace(old, new)
          old, new = "Auto change directory".encode('ascii'), "Verzeichniswechsel auto".encode('ascii')
          if old not in dos_source:
              raise SystemExit('Missing expected setup label: ' + old.decode('ascii'))
          dos_source = dos_source.replace(old, new)
          old, new = "Show hidden subdirectories".encode('ascii'), "Versteckte Ordner zeigen".encode('ascii')
          if old not in dos_source:
              raise SystemExit('Missing expected setup label: ' + old.decode('ascii'))
          dos_source = dos_source.replace(old, new)
          old, new = "Auto rescan tree".encode('ascii'), "Baum neu lesen".encode('ascii')
          if old not in dos_source:
              raise SystemExit('Missing expected setup label: ' + old.decode('ascii'))
          dos_source = dos_source.replace(old, new)
          old, new = "Auto change dir time delay:".encode('ascii'), "Verz.-Wechsel nach:".encode('ascii')
          if old not in dos_source:
              raise SystemExit('Missing expected setup label: ' + old.decode('ascii'))
          dos_source = dos_source.replace(old, new)
          old, new = "to change an option,".encode('ascii'), "Option aendern,".encode('ascii')
          if old not in dos_source:
              raise SystemExit('Missing expected setup label: ' + old.decode('ascii'))
          dos_source = dos_source.replace(old, new)
          old, new = "to move between options".encode('ascii'), "Optionen wechseln".encode('ascii')
          if old not in dos_source:
              raise SystemExit('Missing expected setup label: ' + old.decode('ascii'))
          dos_source = dos_source.replace(old, new)
          old, new = "Cancel".encode('ascii'), "Abbruch".encode('ascii')
          if old not in dos_source:
              raise SystemExit('Missing expected setup label: ' + old.decode('ascii'))
          dos_source = dos_source.replace(old, new)
          Path('/tmp/vc-build/versions/4.05/VCSETUP.ASM').write_bytes(dos_source)
          translated_sub = Path('versions/4.05/VCSTSUB.INC').read_text(encoding='utf-8')
          dos_sub = translated_sub.encode('latin-1', errors='strict')
          Path('/tmp/vc-build/versions/4.05/VCSTSUB.INC').write_bytes(dos_sub)
          PY

      - name: Compile VC 4.05 and setup utility
        working-directory: /tmp/vc-build
        env:
          VC_BUILD_MODE: native
        run: ./build.sh 4.05

      - name: Collect binaries and build diagnostics
        if: always()
        run: |
          mkdir -p dist
          for f in VC.COM VCSETUP.COM; do
            if [ -s "/tmp/vc-build/build/4.05/$f" ]; then cp "/tmp/vc-build/build/4.05/$f" "dist/$f"; fi
          done
          if [ -f /tmp/vc-build/build/4.05/stage/build.log ]; then cp /tmp/vc-build/build/4.05/stage/build.log dist/BUILD.LOG; fi
          if [ -f /tmp/vc-build/build/4.05/stage/debugcon.log ]; then cp /tmp/vc-build/build/4.05/stage/debugcon.log dist/DEBUGCON.LOG; fi
          cat > dist/README-DE.txt <<'EOF'
          Volkov Commander 4.05 – deutsche Testfassung

          Entwicklungsstand, kein offizielles Release.
          Bitte zuerst in DOSBox mit einer Testkopie ausprobieren.
          BUILD.LOG und DEBUGCON.LOG enthalten Diagnosedaten.
          EOF
          test -s dist/VC.COM
          test -s dist/VCSETUP.COM

      - name: Upload DOS binaries and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vc-4.05-german-test
          path: dist/
          if-no-files-found: warn
          retention-days: 14
