name: Build German VC 4.05

on:
  push:
    branches: [german-4.05]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out German translation
        uses: actions/checkout@v4
        with:
          ref: german-4.05

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm qemu-system-i386 mtools coreutils

      - name: Prepare reproducible DOS build
        run: |
          git clone --depth 1 --branch build --recurse-submodules https://github.com/ddanila/vc.git /tmp/vc-build
          cp versions/4.05/VCMENU.INC /tmp/vc-build/versions/4.05/VCMENU.INC

      - name: Compile VC 4.05 and setup utility
        working-directory: /tmp/vc-build
        env:
          VC_BUILD_MODE: native
        run: ./build.sh 4.05

