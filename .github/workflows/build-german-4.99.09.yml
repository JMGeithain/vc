name: Build German VC 4.99.09

on:
  push:
    branches: [german-4.99.09]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out German translation
        uses: actions/checkout@v4
        with:
          ref: german-4.99.09

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm qemu-system-x86 mtools coreutils

      - name: Prepare upstream reproducible build environment
        run: |
          git clone --depth 1 --branch build --recurse-submodules https://github.com/ddanila/vc.git /tmp/vc-build
          python3 - <<'PY'
          from pathlib import Path
          p = Path("/tmp/vc-build/versions/4.99.09/VCMENU.INC")
          s = p.read_text(encoding="utf-8")
          replacements = [
              ("' ^Brief'", "' ^Kurz'"),
              ("' ^Full'", "' ^Lang'"),
              ("' D^escription'", "' ^Text'"),
              ("' ^Quick view'", "' ^Vorschau'"),
              ("' ^On/Off'", "' ^Ein/Aus'"),
              ("' Long n^ames'", "' Lange N^amen'"),
              ("' E^xtension'", "' ^Endung'"),
              ("' Ti^me'", "' ^Zeit'"),
              ("' ^Size'", "' ^Groesse'"),
              ("' ^Unsorted'", "' ^Unsortiert'"),
              ("' Re^verse'", "' Umge^kehrt'"),
              ("' ^Re-read'", "' ^Neu lesen'"),
              ("' ^Drive...'", "' ^Laufwerk...'"),
              ("'^Help'", "'^Hilfe'"),
              ("'^User menu'", "'^Benutzermenue'"),
              ("'^View'", "'^Anzeigen'"),
              ("'^Edit'", "'^Bearbeiten'"),
              ("'^Copy'", "'^Kopieren'"),
              ("'^Rename or move'", "'^Umbenennen/Verschieben'"),
              ("'^Make directory'", "'^Verzeichnis anlegen'"),
              ("'^Delete'", "'^Loeschen'"),
              ("'^Attributes'", "'^Attribute'"),
              ("'Select ^group'", "'Gruppe ^waehlen'"),
              ("'U^nselect group'", "'Gruppe ab^waehlen'"),
              ("'^Invert group'", "'Gruppe ^umkehren'"),
              ("'^Quit'", "'^Beenden'"),
              ("'^Tree'", "'^Baum'"),
              ("'Volume ^label'", "'Volume-^Label'"),
              ("'Memory ^info'", "'Speicher^info'"),
              ("'^Directory sizes'", "'^Verzeichnisgroessen'"),
              ("'^Find file'", "'^Datei suchen'"),
              ("'^History'", "'^Verlauf'"),
              ("'^EGA lines'", "'^EGA-Zeilen'"),
              ("'^Video mode'", "'^Videomodus'"),
              ("'^Swap panels'", "'Fenster ^tauschen'"),
              ("'^Panels on/off'", "'Fenster ein/aus'"),
              ("'^Compare directories'", "'Verzeichnisse ^vergleichen'"),
              ("'^Menu file edit'", "'^Menue-Datei bearbeiten'"),
              ("' ^General...'", "' ^Allgemein...'"),
              ("' ^Interface...'", "' ^Oberflaeche...'"),
              ("' C^haracters...'", "' ^Zeichen...'"),
              ("' ^Panels...'", "' ^Fenster...'"),
              ("' ^Descriptions...'", "' ^Beschreibungen...'"),
              ("' Sc^reen saver...'", "' ^Bildschirmschoner...'"),
              ("' ^Copy and Move...'", "' ^Kopieren/Verschieben...'"),
              ("' E^xtension file edit...'", "' ^Erweiterungsdatei...'"),
              ("' ^Viewers...'", "' ^Betrachter...'"),
              ("' ^Editors...'", "' ^Editoren...'"),
              ("' ^Auto menus'", "' ^Automatische Menues'"),
              ("' ^Key bar'", "' ^Tastenleiste'"),
              ("' ^Full screen'", "' ^Vollbild'"),
              ("' Mi^ni status'", "' Mi^nistatus'"),
              ("' ^Memory allocation'", "' ^Speicherbelegung'"),
              ("' ^Save setup'", "' ^Einstellungen speichern'"),
          ]
          applied = 0
          for old, new in replacements:
              if old in s:
                  s = s.replace(old, new)
                  applied += 1
          if applied < 15:
              raise SystemExit(f"Too few menu translations applied ({applied}); source changed?")
          p.write_text(s, encoding="utf-8")
          print(f"Applied {applied} German menu translations.")
          PY

      - name: Build VC 4.99.09
        working-directory: /tmp/vc-build
        env:
          VC_BUILD_MODE: native
        run: ./build.sh 4.99.09


      - name: Verify complete runtime package
        run: |
          test -s /tmp/vc-build/build/4.99.09/jwasm/VC.COM || {
            echo "::error::VC.COM was not produced"
            exit 1
          }
          test -s /tmp/vc-build/build/4.99.09/VC.OVL || {
            echo "::error::VC.OVL is missing; do not publish an incomplete test package"
            exit 1
          }

      - name: Package test binaries and build logs
        if: always()
        run: |
          mkdir -p dist
          if [ -d /tmp/vc-build/build/4.99.09 ]; then
            find /tmp/vc-build/build/4.99.09 -maxdepth 3 -type f \( -iname '*.com' -o -iname '*.ovl' -o -iname '*.log' \) -exec cp --parents {} dist/ \;
          fi
          cat > dist/README-TEST-DE.txt <<'EOF'
          Volkov Commander 4.99.09 – deutsche Testfassung
          
          Dieses Paket ist ein Entwicklungsstand und kein offizielles Release.
          Bitte in einer DOSBox-/DOS-Umgebung testen, nicht auf produktiven Daten.
          Prüfen: Start, Menütexte, Tastenkürzel, Dateioperationen und Darstellung.
          Bei Fehlern bitte die Fehlermeldung und die verwendete DOSBox-Version mitteilen.
          EOF

      - name: Upload test package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vc-4.99.09-german-test
          path: dist/
          if-no-files-found: warn
          retention-days: 14
