name: Build German VC 4.99.09

on:
  push:
    branches: [german-4.99.09]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out German translation
        uses: actions/checkout@v4
        with:
          ref: german-4.99.09

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm qemu-system-x86 mtools coreutils

      - name: Prepare upstream reproducible build environment
        run: |
          git clone --depth 1 --branch build --recurse-submodules https://github.com/ddanila/vc.git /tmp/vc-build
          cp versions/4.99.09/VCMENU.INC /tmp/vc-build/versions/4.99.09/VCMENU.INC

      - name: Build VC 4.99.09
        working-directory: /tmp/vc-build
        env:
          VC_BUILD_MODE: native
        run: ./build.sh 4.99.09

      - name: Package test binaries and build logs
        if: always()
        run: |
          mkdir -p dist
          if [ -d /tmp/vc-build/build/4.99.09 ]; then
            find /tmp/vc-build/build/4.99.09 -maxdepth 3 -type f \( -iname '*.com' -o -iname '*.ovl' -o -iname '*.log' \) -exec cp --parents {} dist/ \;
          fi
          cat > dist/README-TEST-DE.txt <<'EOF'
          Volkov Commander 4.99.09 – deutsche Testfassung
          
          Dieses Paket ist ein Entwicklungsstand und kein offizielles Release.
          Bitte in einer DOSBox-/DOS-Umgebung testen, nicht auf produktiven Daten.
          Prüfen: Start, Menütexte, Tastenkürzel, Dateioperationen und Darstellung.
          Bei Fehlern bitte die Fehlermeldung und die verwendete DOSBox-Version mitteilen.
          EOF

      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: vc-4.99.09-german-test
          path: dist/
          if-no-files-found: warn
          retention-days: 14
